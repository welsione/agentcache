# AgentCache 生产部署 compose：从 GHCR 拉取镜像，不从源码构建。
# 用法：docker compose -f docker-compose.prod.yml up -d
# 镜像默认通过南京大学 GHCR 镜像加速（国内服务器拉取快），可通过 IMAGE_PREFIX 切回官方源。
services:
  mysql:
    image: mysql:8.4
    container_name: agentcache-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: agentcache
      MYSQL_USER: agentcache
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "agentcache", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${IMAGE_PREFIX:-ghcr.nju.edu.cn}/welsione/agentcache-backend:${IMAGE_TAG:-latest}
    container_name: agentcache-api
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: agentcache
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AGENTCACHE_CONFIG_KEY: ${AGENTCACHE_CONFIG_KEY}
      STORAGE_TYPE: local
      STORAGE_LOCAL_BASE_PATH: /data/files
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=50"
    volumes:
      - file-data:/data/files
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # /api/auth/login 只接受 POST，用 curl 检查任意 HTTP 响应即可确认服务存活
      test: ["CMD-SHELL", "curl -fsSo /dev/null http://127.0.0.1:8080/api/auth/login || curl -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/auth/login 2>/dev/null | grep -qE '^[245]'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  web:
    image: ${IMAGE_PREFIX:-ghcr.nju.edu.cn}/welsione/agentcache-frontend:${IMAGE_TAG:-latest}
    container_name: agentcache-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  file-data:
