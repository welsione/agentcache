spring:
  datasource:
    url: jdbc:h2:mem:agentcache-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/test-migration

agentcache:
  jwt:
    secret: test-secret-test-secret-test-secret-1234

storage:
  type: local
  local:
    base-path: ${java.io.tmpdir}/agentcache-test