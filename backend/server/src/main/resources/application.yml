server:
  port: 8080

spring:
  application:
    name: agentcache-server
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/agentcache
    username: ${MYSQL_USERNAME:agentcache}
    password: ${MYSQL_PASSWORD:agentcache}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd'T'HH:mm:ss
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  flyway:
    enabled: true
    locations: classpath:db/migration

agentcache:
  jwt:
    secret: ${JWT_SECRET}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5508}

storage:
  type: ${STORAGE_TYPE:local}
  local:
    base-path: ${STORAGE_LOCAL_BASE_PATH:/data/files}
